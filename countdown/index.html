<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" />
    <title>BISILE | Launching Soon</title>
    <meta name="description" content="BISILE launches a new collection experience on 21 June 2026." />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700;6..96,800&family=Inter:wght@300;400;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: #ffffff;
        color: #000000;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .page {
        isolation: isolate;
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden;
        background: #ffffff;
      }

      .background-carousel {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background: #ffffff;
      }

      .carousel-slide {
        position: absolute;
        inset: -24px;
        opacity: 0;
        transform: scale(1.06);
        transition:
          opacity 1.9s ease,
          transform 6s ease;
      }

      .carousel-slide.is-active {
        opacity: 1;
        transform: scale(1.015);
      }

      .carousel-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: blur(7px);
      }

      .white-cover {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.46), transparent 34%),
          rgba(255, 255, 255, 0.68);
        backdrop-filter: blur(9px);
        -webkit-backdrop-filter: blur(9px);
      }

      .brand {
        position: fixed;
        top: clamp(1.3rem, 3vw, 2rem);
        left: 50%;
        z-index: 2;
        width: clamp(78px, 8vw, 118px);
        transform: translateX(-50%);
        opacity: 0.9;
      }

      .countdown-content {
        position: relative;
        z-index: 1;
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
        padding: clamp(1.2rem, 3vw, 3rem);
        text-align: center;
      }

      .countdown-inner {
        width: min(94vw, 1280px);
        animation: contentIn 1.15s ease both;
      }

      .eyebrow {
        margin: 0 0 clamp(1rem, 2vw, 1.5rem);
        color: rgba(0, 0, 0, 0.72);
        font-size: clamp(0.72rem, 1vw, 0.95rem);
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .countdown {
        display: flex;
        align-items: end;
        justify-content: center;
        gap: clamp(0.55rem, 1.7vw, 1.7rem);
      }

      .countdown-number {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: clamp(3.35rem, 12vw, 12rem);
        color: #000000;
        font-family: "Bodoni Moda", Georgia, serif;
        font-size: clamp(3.5rem, 13vw, 13rem);
        font-weight: 800;
        letter-spacing: -0.06em;
        line-height: 0.9;
      }

      .digit {
        display: inline-block;
        min-width: 0.56em;
        will-change: transform, opacity, filter;
      }

      .digit.is-changing {
        animation: digitSlideDown 0.45s ease both;
      }

      .countdown-label {
        margin-top: clamp(0.45rem, 1vw, 0.8rem);
        color: rgba(0, 0, 0, 0.65);
        font-size: clamp(0.65rem, 1vw, 0.9rem);
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .separator {
        align-self: center;
        padding-bottom: clamp(1.25rem, 2.8vw, 2.6rem);
        color: rgba(0, 0, 0, 0.5);
        font-family: "Bodoni Moda", Georgia, serif;
        font-size: clamp(2rem, 6vw, 6rem);
        font-weight: 800;
        line-height: 1;
      }

      .supporting {
        margin: clamp(1.15rem, 2.5vw, 2rem) auto 0;
        max-width: 620px;
        color: rgba(0, 0, 0, 0.65);
        font-size: clamp(0.9rem, 1.5vw, 1.1rem);
        font-weight: 300;
        line-height: 1.7;
      }

      .finished .countdown {
        display: none;
      }

      .finished-message {
        display: none;
        color: #000000;
        font-family: "Bodoni Moda", Georgia, serif;
        font-size: clamp(4rem, 12vw, 12rem);
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 0.9;
      }

      .finished .finished-message {
        display: block;
        animation: digitSlideDown 0.7s ease both;
      }

      @keyframes digitSlideDown {
        0% {
          transform: translateY(-35%);
          opacity: 0;
          filter: blur(4px);
        }

        50% {
          opacity: 1;
          filter: blur(0);
        }

        100% {
          transform: translateY(0);
          opacity: 1;
          filter: blur(0);
        }
      }

      @keyframes contentIn {
        from {
          transform: translateY(14px);
          opacity: 0;
          filter: blur(8px);
        }

        to {
          transform: translateY(0);
          opacity: 1;
          filter: blur(0);
        }
      }

      @media (max-width: 700px) {
        .countdown {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 1.05rem 0.75rem;
        }

        .separator {
          display: none;
        }

        .countdown-number {
          min-height: clamp(3rem, 18vw, 5.8rem);
          font-size: clamp(3.25rem, 18vw, 6rem);
        }

        .countdown-label {
          margin-top: 0.35rem;
          font-size: 0.62rem;
        }

        .supporting {
          max-width: 20rem;
        }
      }

      @media (max-width: 370px) {
        .countdown {
          gap: 0.82rem 0.45rem;
        }

        .countdown-number {
          font-size: clamp(2.7rem, 17vw, 4.6rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .carousel-slide,
        .carousel-slide.is-active,
        .countdown-inner,
        .digit.is-changing,
        .finished .finished-message {
          animation: none;
          transition: none;
          transform: none;
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page" aria-labelledby="launch-title">
      <div class="background-carousel" id="backgroundCarousel" aria-hidden="true"></div>
      <div class="white-cover" aria-hidden="true"></div>
      <img class="brand" src="assets/logo.png" alt="BISILE" />

      <section class="countdown-content">
        <div class="countdown-inner" id="countdownRoot">
          <p class="eyebrow" id="launch-title">Launching Soon</p>
          <div class="finished-message" aria-live="polite">We are live.</div>

          <div class="countdown" aria-live="polite">
            <div class="time-block">
              <div class="countdown-number" data-unit="days"></div>
              <div class="countdown-label">Days</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
              <div class="countdown-number" data-unit="hours"></div>
              <div class="countdown-label">Hours</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
              <div class="countdown-number" data-unit="minutes"></div>
              <div class="countdown-label">Minutes</div>
            </div>
            <div class="separator">:</div>
            <div class="time-block">
              <div class="countdown-number" data-unit="seconds"></div>
              <div class="countdown-label">Seconds</div>
            </div>
          </div>

          <p class="supporting">Our new collection experience arrives on 21 June.</p>
        </div>
      </section>
    </main>

    <script>
      const targetDate = new Date("2026-06-21T00:00:00+02:00");

      const carouselImages = [
        "assets/perfume-bottles.jpg",
        "assets/hero-perfume.jpg",
        "assets/perfume-basket.jpg",
        "assets/perfume-picnic.jpg",
        "assets/packaging-black.jpg",
        "assets/wig-straight.jpg"
      ];

      const carousel = document.getElementById("backgroundCarousel");
      const countdownRoot = document.getElementById("countdownRoot");
      const previousValues = {};
      let countdownInterval;

      carouselImages.forEach((src, index) => {
        const slide = document.createElement("div");
        slide.className = `carousel-slide${index === 0 ? " is-active" : ""}`;
        const image = document.createElement("img");
        image.src = src;
        image.alt = "";
        image.loading = index === 0 ? "eager" : "lazy";
        slide.appendChild(image);
        carousel.appendChild(slide);
      });

      const slides = Array.from(document.querySelectorAll(".carousel-slide"));
      let activeSlide = 0;

      window.setInterval(() => {
        slides[activeSlide].classList.remove("is-active");
        activeSlide = (activeSlide + 1) % slides.length;
        slides[activeSlide].classList.add("is-active");
      }, 5200);

      const pad = (value) => String(value).padStart(2, "0");

      const getTimeParts = () => {
        const remaining = Math.max(0, targetDate.getTime() - Date.now());
        const totalSeconds = Math.floor(remaining / 1000);

        const days = Math.floor(totalSeconds / 86400);
        const hours = Math.floor((totalSeconds % 86400) / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        return {
          remaining,
          values: {
            days: String(days),
            hours: pad(hours),
            minutes: pad(minutes),
            seconds: pad(seconds)
          }
        };
      };

      const renderDigits = (unit, value) => {
        const container = document.querySelector(`[data-unit="${unit}"]`);
        const previous = previousValues[unit] || "";

        container.innerHTML = "";
        value.split("").forEach((character, index) => {
          const digit = document.createElement("span");
          digit.className = "digit";
          digit.textContent = character;
          if (previous[index] !== character) {
            digit.classList.add("is-changing");
            digit.addEventListener("animationend", () => digit.classList.remove("is-changing"), { once: true });
          }
          container.appendChild(digit);
        });

        previousValues[unit] = value;
      };

      const updateCountdown = () => {
        const { remaining, values } = getTimeParts();

        Object.entries(values).forEach(([unit, value]) => renderDigits(unit, value));

        if (remaining <= 0) {
          countdownRoot.classList.add("finished");
          if (countdownInterval) window.clearInterval(countdownInterval);
        }
      };

      updateCountdown();
      countdownInterval = window.setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
