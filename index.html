<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BISILE | Be Luxury</title>
    <meta
      name="description"
      content="BISILE is a curated luxury destination for fragrance, hair, beauty rituals, and thoughtful gifting."
    />
    <link rel="icon" href="/media/Screenshot 2026-01-18 163847.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,ital,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@300;400;500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0E0E0D',
              secondary: '#FFFFFF',
              accent: '#B8A36A',
              charcoal: '#151515',
              'soft-black': '#1C1C1A',
              'muted-white': '#CFCBC2',
              'text-dark': '#1C1C1A',
              'text-light': '#7F7F78',
              'off-white': '#FFFFFF'
            },
            fontFamily: {
              serif: ['"Cormorant Garamond"', '"Times New Roman"', 'serif'],
              subhead: ['"Bodoni Moda"', 'serif'],
              sans: ['"Montserrat"', 'sans-serif'],
              inter: ['"Inter"', 'sans-serif'],
            },
            letterSpacing: {
              widest: '.25em',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
              'fade-in': 'fadeIn 1s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #ffffff;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>

  </body>
