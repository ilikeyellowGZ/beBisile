services:
  - type: web
    name: bisile-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: bisile
      - key: MONGODB_DB_NAME
        value: bisile
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESET_ADMIN_CURRENT
        value: admin
      - key: RESET_ADMIN_USERNAME
        value: admin
      - key: RESET_ADMIN_EMAIL
        value: studio@bisile.co.za
      - key: RESET_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: orders@bisile.co.za
      - key: RESEND_FROM_NAME
        value: BISILE
      - key: FROM_EMAIL
        value: orders@bisile.co.za
      - key: ADMIN_NOTIFICATION_EMAIL
        value: bisilebeautyandmakeup@gmail.com
