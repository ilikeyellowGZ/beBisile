name = "bebisile"
compatibility_date = "2026-11-26"
main = "./worker.js"

[[routes]]
pattern = "bisile.co.za"
custom_domain = true

[[routes]]
pattern = "www.bisile.co.za"
custom_domain = true

[[routes]]
pattern = "api.bisile.co.za"
custom_domain = true

[vars]
API_UPSTREAM_URL = "https://bebisile.onrender.com"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]
